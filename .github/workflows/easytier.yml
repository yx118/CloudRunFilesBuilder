#=================================================
# Description: Build RunFiles using GitHub Actions for EasyTier (IPK Version - Multi-Arch Split)
# License: MIT
#=================================================

name: Build EasyTier RunFile (IPK - OpenWrt 24)

on:
  schedule:
    - cron: "10 22 * * *"  # 北京时间早上 6 点 10 分
  workflow_dispatch:

env:
  # 在此处定义你需要的 CPU 架构，每个架构会独立生成一个 .run 文件
  TARGET_ARCHS: "x86_64 aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget unzip

      - name: Fetch Latest Release Info
        id: fetch_release
        run: |
          API_URL="https://api.github.com/repos/EasyTier/luci-app-easytier/releases/latest"
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" $API_URL)
          
          VERSION=$(echo "$RESPONSE" | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "获取到的最新版本: $VERSION"
          
          # 将 API 响应内容保存到临时文件，供后续步骤读取
          echo "$RESPONSE" > release_response.json

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Build Run Files Per Architecture
        run: |
          VERSION="${{ env.version }}"
          RESPONSE=$(cat release_response.json)
          
          for ARCH in $TARGET_ARCHS; do
            echo "========================================="
            echo "正在独立处理架构: $ARCH"
            
            # 为当前架构创建专属的工作目录
            WORK_DIR="pkg-$ARCH"
            mkdir -p "$WORK_DIR"
            
            # 筛选出当前架构且包含 22.03.7 的 zip 链接
            ZIP_URL=$(echo "$RESPONSE" | jq -r ".assets[] | select((.name | contains(\"$ARCH\")) and (.name | endswith(\".zip\") and contains(\"22.03.7\"))) | .browser_download_url")
            
            if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
              filename=$(basename "$ZIP_URL")
              echo "下载 $ARCH 压缩包: $filename"
              wget -q "$ZIP_URL" -O "$WORK_DIR/$filename"
              
              echo "解压到 $WORK_DIR ..."
              cd "$WORK_DIR"
              unzip -q -o "$filename"
              rm -f "$filename"
              
              # 仅保留当前架构的 .ipk 文件，清理其他杂项
              find . -type f ! -name "*.ipk" -delete
              
              # 检查是否有成功提取到 ipk
              if ! ls *.ipk 1> /dev/null 2>&1; then
                echo "错误: $ARCH 架构解压后未找到 .ipk 文件！"
                cd ..
                continue
              fi
              
              # 写入专属的安装脚本
              cat << 'EOF' > install.sh
          #!/bin/sh
          echo "开始安装 EasyTier ($ARCH IPK版本)..."
          if ! command -v opkg >/dev/null 2>&1; then
              echo "错误: 当前系统未找到 opkg 包管理器！"
              exit 1
          fi
          opkg update || echo "刷新软件源失败，尝试直接安装..."
          opkg install *.ipk || exit 1
          echo "EasyTier 安装成功！"
          EOF
              chmod +x install.sh
              
              cd ..
              
              echo "正在使用 makeself 打包 $ARCH 的 .run 文件..."
              ./makeself/makeself.sh "$WORK_DIR" "easytier-installer-ipk-$ARCH-$VERSION.run" "EasyTier IPK Installer ($ARCH)" "$WORK_DIR/install.sh"
              
            else
              echo "警告: 未在 Release 中找到架构 $ARCH 对应的 22.03.7 压缩包！"
            fi
          done

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: *.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <p align="left">
             <img src="https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
            </p>
            
            **插件版本**: `${{ env.version }}`
            **适用环境**: OpenWrt 24 及更早版本 (`22.03.7` / `opkg`) - **多架构独立打包**
