#=================================================
# Description: Build RunFiles using GitHub Actions for EasyTier
# License: MIT
#=================================================

name: Build EasyTier RunFile (APK & IPK)

on:
  schedule:
    - cron: "10 22 * * *"  # 北京时间早上 6 点 10 分
  workflow_dispatch:

env:
  # 在此处定义你需要的 CPU 架构，空格分隔
  # 常见架构：x86_64, aarch64_cortex-a53, aarch64_generic, mipsel_24kc 等
  TARGET_ARCHS: "x86_64 aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget unzip

      - name: Create working directory
        run: mkdir -p easytier-workdir
        
      - name: Fetch Latest EasyTier Assets
        id: fetch_release
        run: |
          API_URL="https://api.github.com/repos/EasyTier/luci-app-easytier/releases/latest"
          VERSION=$(curl -s $API_URL | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_ENV
          
          cd easytier-workdir
          
          for ARCH in $TARGET_ARCHS; do
            echo "正在处理架构: $ARCH ..."
            mkdir -p $ARCH-ipk $ARCH-apk
            
            # 获取 IPK 版本的 zip 下载链接 (包含 22.03 字样)
            IPK_ZIP_URL=$(curl -s $API_URL | jq -r ".assets[] | select(.name | contains(\"$ARCH\") and contains(\"22.03\")) | .browser_download_url")
            # 获取 APK 版本的 zip 下载链接 (包含 SNAPSHOT 字样)
            APK_ZIP_URL=$(curl -s $API_URL | jq -r ".assets[] | select(.name | contains(\"$ARCH\") and contains(\"SNAPSHOT\")) | .browser_download_url")
            
            # 下载并解压 IPK 包
            if [ -n "$IPK_ZIP_URL" ]; then
              echo "Downloading IPK zip: $IPK_ZIP_URL"
              wget -q -O $ARCH-ipk.zip "$IPK_ZIP_URL"
              unzip -q $ARCH-ipk.zip -d $ARCH-ipk/
              rm -f $ARCH-ipk.zip
            else
              echo "警告: 未找到 $ARCH 的 IPK 压缩包！"
            fi
            
            # 下载并解压 APK 包
            if [ -n "$APK_ZIP_URL" ]; then
              echo "Downloading APK zip: $APK_ZIP_URL"
              wget -q -O $ARCH-apk.zip "$APK_ZIP_URL"
              unzip -q $ARCH-apk.zip -d $ARCH-apk/
              rm -f $ARCH-apk.zip
            else
              echo "警告: 未找到 $ARCH 的 APK 压缩包！"
            fi
          done

      - name: Create install scripts
        run: |
          cd easytier-workdir
          
          for ARCH in $TARGET_ARCHS; do
            # 给 IPK 目录写入 opkg 安装脚本
            if [ -d "$ARCH-ipk" ] && [ "$(ls -A $ARCH-ipk)" ]; then
              cat << 'EOF' > $ARCH-ipk/install.sh
          #!/bin/sh
          echo "开始安装 EasyTier (IPK / OpenWrt 24及更早版本)..."
          if ! command -v opkg >/dev/null 2>&1; then
              echo "错误: 未找到 opkg！此安装包仅适用传统架构固件。"
              exit 1
          fi
          opkg update || echo "刷新软件源失败，尝试直接离线安装..."
          opkg install *.ipk || exit 1
          echo "EasyTier (IPK) 安装成功！"
          EOF
              chmod +x $ARCH-ipk/install.sh
            fi

            # 给 APK 目录写入 apk 安装脚本
            if [ -d "$ARCH-apk" ] && [ "$(ls -A $ARCH-apk)" ]; then
              cat << 'EOF' > $ARCH-apk/install.sh
          #!/bin/sh
          echo "开始安装 EasyTier (APK / OpenWrt 25+ / ImmortalWrt 24.10+)..."
          if ! command -v apk >/dev/null 2>&1; then
              echo "错误: 未找到 apk！此安装包仅适用新版固件环境。"
              exit 1
          fi
          apk update || echo "刷新软件源失败，尝试直接安装..."
          apk add --allow-untrusted *.apk || exit 1
          echo "EasyTier (APK) 安装成功！"
          EOF
              chmod +x $ARCH-apk/install.sh
            fi
          done

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Build run files with makeself
        run: |
          cd easytier-workdir
          
          for ARCH in $TARGET_ARCHS; do
            # 打包 IPK 安装器 (适用于 OpenWrt 24)
            if [ -d "$ARCH-ipk" ] && [ -f "$ARCH-ipk/install.sh" ]; then
              ../makeself/makeself.sh $ARCH-ipk/ ../easytier-installer-openwrt24-ipk-$ARCH-${{ env.version }}.run "EasyTier IPK Installer ($ARCH)" ./install.sh
            fi
            
            # 打包 APK 安装器 (适用于 OpenWrt 25)
            if [ -d "$ARCH-apk" ] && [ -f "$ARCH-apk/install.sh" ]; then
              ../makeself/makeself.sh $ARCH-apk/ ../easytier-installer-openwrt25-apk-$ARCH-${{ env.version }}.run "EasyTier APK Installer ($ARCH)" ./install.sh
            fi
          done
          
      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: *.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <p align="left">
             <img src="https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
            </p>
            
            **EasyTier 插件版本**: `${{ env.version }}`
            
            ### 📦 文件说明
            * `*-openwrt24-ipk-*.run`：适用于 OpenWrt 24 及更老版本 (基于 `opkg`)
            * `*-openwrt25-apk-*.run`：适用于 OpenWrt 25 / ImmortalWrt 24.10+ (基于 `apk`)
            
            自动从 [EasyTier/luci-app-easytier](https://github.com/EasyTier/luci-app-easytier) 拉取并构建。
