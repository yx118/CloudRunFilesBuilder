#=================================================
# Description: Build RunFiles using GitHub Actions for EasyTier
# License: MIT
#=================================================

name: Build EasyTier RunFile (APK & IPK)

on:
  schedule:
    - cron: "10 22 * * *"  # 北京时间早上 6 点 10 分
  workflow_dispatch:

env:
  # 在此处定义你需要的 CPU 架构，空格分隔
  TARGET_ARCHS: "x86_64 aarch64_cortex-a53"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget unzip

      - name: Create working directory
        run: mkdir -p easytier-workdir
        
      - name: Fetch Latest EasyTier Assets
        id: fetch_release
        run: |
          API_URL="https://api.github.com/repos/EasyTier/luci-app-easytier/releases/latest"
          # 使用 Token 防止请求超限导致获取不到数据
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" $API_URL)
          
          VERSION=$(echo "$RESPONSE" | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "最新版本为: $VERSION"
          
          cd easytier-workdir
          
          for ARCH in $TARGET_ARCHS; do
            echo "========================================="
            echo "开始处理架构: $ARCH"
            mkdir -p $ARCH-ipk $ARCH-apk
            
            # 抓取包含该架构，并且是 ipk/apk 或对应 zip 的所有链接
            IPK_URLS=$(echo "$RESPONSE" | jq -r ".assets[] | select((.name | contains(\"$ARCH\") or contains(\"all\")) and (.name | endswith(\".ipk\") or (endswith(\".zip\") and contains(\"22.03\")))) | .browser_download_url")
            APK_URLS=$(echo "$RESPONSE" | jq -r ".assets[] | select((.name | contains(\"$ARCH\") or contains(\"all\")) and (.name | endswith(\".apk\") or (endswith(\".zip\") and contains(\"SNAPSHOT\")))) | .browser_download_url")
            
            # 智能下载与处理 IPK
            if [ -n "$IPK_URLS" ]; then
              for url in $IPK_URLS; do
                filename=$(basename "$url")
                echo "下载 IPK 相关文件: $filename"
                wget -q -O "$ARCH-ipk/$filename" "$url"
                
                # 如果是 zip，则解压并删除原 zip
                if [[ "$filename" == *.zip ]]; then
                  unzip -q -o "$ARCH-ipk/$filename" -d "$ARCH-ipk/"
                  rm -f "$ARCH-ipk/$filename"
                fi
              done
            else
              echo "警告: 未找到 $ARCH 的 IPK 文件！"
            fi
            
            # 智能下载与处理 APK
            if [ -n "$APK_URLS" ]; then
              for url in $APK_URLS; do
                filename=$(basename "$url")
                echo "下载 APK 相关文件: $filename"
                wget -q -O "$ARCH-apk/$filename" "$url"
                
                # 如果是 zip，则解压并删除原 zip
                if [[ "$filename" == *.zip ]]; then
                  unzip -q -o "$ARCH-apk/$filename" -d "$ARCH-apk/"
                  rm -f "$ARCH-apk/$filename"
                fi
              done
            else
              echo "警告: 未找到 $ARCH 的 APK 文件！"
            fi
          done

      - name: Create install scripts
        run: |
          cd easytier-workdir
          for ARCH in $TARGET_ARCHS; do
            # 检查是否有实际下载到 .ipk
            if ls $ARCH-ipk/*.ipk 1> /dev/null 2>&1; then
              cat << 'EOF' > $ARCH-ipk/install.sh
          #!/bin/sh
          echo "开始安装 EasyTier (IPK / OpenWrt 24及更早版本)..."
          if ! command -v opkg >/dev/null 2>&1; then
              echo "错误: 未找到 opkg！此包仅适用传统架构固件。"
              exit 1
          fi
          opkg update || echo "刷新软件源失败，尝试直接安装..."
          opkg install *.ipk || exit 1
          echo "EasyTier (IPK) 安装成功！"
          EOF
              chmod +x $ARCH-ipk/install.sh
            fi

            # 检查是否有实际下载到 .apk
            if ls $ARCH-apk/*.apk 1> /dev/null 2>&1; then
              cat << 'EOF' > $ARCH-apk/install.sh
          #!/bin/sh
          echo "开始安装 EasyTier (APK / OpenWrt 25+)..."
          if ! command -v apk >/dev/null 2>&1; then
              echo "错误: 未找到 apk！此包仅适用新版固件环境。"
              exit 1
          fi
          apk update || echo "刷新软件源失败，尝试直接安装..."
          apk add --allow-untrusted *.apk || exit 1
          echo "EasyTier (APK) 安装成功！"
          EOF
              chmod +x $ARCH-apk/install.sh
            fi
          done

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Build run files with makeself
        run: |
          cd easytier-workdir
          for ARCH in $TARGET_ARCHS; do
            if [ -f "$ARCH-ipk/install.sh" ]; then
              ../makeself/makeself.sh $ARCH-ipk/ ../easytier-installer-openwrt24-ipk-$ARCH-${{ env.version }}.run "EasyTier IPK Installer ($ARCH)" ./install.sh
            fi
            if [ -f "$ARCH-apk/install.sh" ]; then
              ../makeself/makeself.sh $ARCH-apk/ ../easytier-installer-openwrt25-apk-$ARCH-${{ env.version }}.run "EasyTier APK Installer ($ARCH)" ./install.sh
            fi
          done
          
      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: *.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <p align="left">
             <img src="https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
            </p>
            
            **EasyTier 插件版本**: `${{ env.version }}`
